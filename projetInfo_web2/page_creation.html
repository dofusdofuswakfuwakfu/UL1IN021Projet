<!DOCTYPE html>
<html lang="fr">
    <head>
        <title>Création compte -- Plumber Bros</title>
        <meta charset="utf-8">
        <link href="pages_compte.css" rel="stylesheet">
        <script src="compte_logIn.js" type="text/javascript"></script>
    </head>
    <body>
        <h1>Plumber Bros -- Création de compte</h1>

        <form name="formulaire" method="post" target="_blank">

            <h2>Création du compte</h2>
            <div>
                <label for="pseudo"> Pseudo&nbsp;</label>
                <input name="pseudo" maxlength="20" type="text" id="pseudo">
            </div>
            <div>
                <label for="mot_de_passe"> Mot de passe</label>
                <input name="mot_de_passe" maxlength="20" type="password" id="mdp1">
            </div>
            <div>
                <label for="mot_de_passe2"> Confirmer le mot de passe</label>
                <input name="mot_de_passe2" maxlength="20" type="password" id="mdp2">
            </div>
            <p id="criteres">
                *8 caractères minimum <br>
                *1 lettre et 1 chiffre minimum
            </p>
            <br>
            
            <input value="Valider les informations" type="button" onclick="validerCreation()">
            <p id="message"></p>

            <br><br>
            <a href="compte_logIn.html" class="petit">Se connecter</a>
        </form>

    </body>
</html>
